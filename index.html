<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para minha Baixinha ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #180b20, #6b2857);
    color: white;
    font-family: Georgia, serif;
}

.tela {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
    text-align: center;
}

.conteudo {
    width: 100%;
    max-width: 650px;
}

.coracao {
    font-size: 80px;
    animation: pulsar 1.5s infinite;
}

h1 {
    font-size: 48px;
    font-weight: normal;
}

h2 {
    font-size: 38px;
    font-weight: normal;
}

.subtitulo {
    font-size: 20px;
    line-height: 1.6;
    opacity: 0.85;
}

.data {
    margin-top: 25px;
    letter-spacing: 5px;
}

button {
    margin-top: 35px;
    padding: 16px 30px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.12);
    color: white;
    font-size: 17px;
}

.texto {
    text-align: left;
}

.texto p {
    font-size: 18px;
    line-height: 1.8;
}

.destaque {
    font-size: 22px !important;
    font-style: italic;
    padding: 20px;
    border-left: 3px solid rgba(255,255,255,0.5);
}

.capitulo {
    font-size: 13px;
    letter-spacing: 5px;
    opacity: 0.7;
}

.escondido {
    display: none;
}

@keyframes pulsar {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }

    100% {
        transform: scale(1);
    }

}

</style>

</head>

<body>


<!-- ABERTURA -->

<section id="abertura" class="tela">

<div class="conteudo">

<div class="coracao">
❤️
</div>

<h1>
Para minha Baixinha
</h1>

<div class="subtitulo">
Uma história que começou muito antes do nosso namoro...
</div>

<div class="data">
21 • 10 • 2025
</div>

<button onclick="começar()">
✨ Começar nossa história
</button>

</div>

</section>


<!-- HISTÓRIA -->

<section id="historia" class="tela escondido">

<div class="conteudo">

<div id="numero" class="capitulo"></div>

<h2 id="titulo"></h2>

<div id="texto" class="texto"></div>

<button onclick="proximo()">
Continuar →
</button>

</div>

</section>


<script>

let capitulo = 0;


const historia = [

{
numero: "CAPÍTULO 1",
titulo: "Antes de nós",

texto: `
<p>Quando eu era criança, costumava passar bastante tempo na casa do Carlos Daniel.</p>

<p>Ele era uma pessoa muito importante para mim. Eu ia até lá para brincar, conversar e passar um tempo com ele.</p>

<p>Mas a vida acabou levando o Carlos cedo demais.</p>

<p>Ele partiu quando eu tinha 14 anos.</p>

<p>E mesmo depois disso, eu continuei frequentando a casa dos avós dele.</p>

<p class="destaque">
O que eu ainda não sabia era que, naquela mesma família,
existia alguém que um dia se tornaria uma das pessoas
mais importantes da minha vida.
</p>

<p>Só que eu ainda nem conhecia a Mirela. ❤️</p>
`
},

{

numero: "CAPÍTULO 2",

titulo: "Quando nossos caminhos se encontraram",

texto: `
<p>O tempo passou.</p>

<p>Eu comecei a frequentar a igreja, conheci os pais da Mirela e comecei a trabalhar com eles no espeto.</p>

<p>Eu ficava na churrasqueira.</p>

<p>E foi ali que comecei a conviver com ela.</p>

<p>A gente se dava muito bem.</p>

<p>Começamos a conversar, brincar e compartilhar nossas coisas.</p>

<p>Ela contava tudo para mim.</p>

<p>Eu contava tudo para ela.</p>

<p class="destaque">
E, sem perceber, eu tinha encontrado minha melhor amiga.
</p>
`
},

{

numero: "CAPÍTULO 3",

titulo: "Ela era minha melhor amiga",

texto: `
<p>Quando a Mirela tinha 15 anos, ela gostava de mim.</p>

<p>E eu?</p>

<p>Eu dizia que ela era minha melhor amiga.</p>

<p>E ainda tinha coragem de dizer que ela era como uma irmã. 😂</p>

<p>Eu não fazia ideia do que estava acontecendo dentro do coração dela.</p>

<p>Mas nossa amizade continuou crescendo.</p>
`
},

{

numero: "CAPÍTULO 4",

titulo: "Nove anos",

texto: `
<p>Os anos passaram.</p>

<p>Nove anos de amizade.</p>

<p>Nove anos de conversas, brincadeiras, segredos, conselhos e momentos que só nós dois entendíamos.</p>

<p>Nós dois tivemos outros relacionamentos.</p>

<p>Nós dois também nos decepcionamos.</p>

<p class="destaque">
Quando eu estava com ela, eu conseguia ser eu mesmo.
</p>
`
},

{

numero: "CAPÍTULO 5",

titulo: "A paz",

texto: `
<p>Depois de viver outras experiências, comecei a lembrar daquela sensação que sempre existiu quando eu estava com ela.</p>

<p><strong>Paz.</strong></p>

<p><strong>Calmaria.</strong></p>

<p>Eu não precisava fingir.</p>

<p>Podia ser espontâneo, brincalhão, teimoso e ter minhas manias.</p>

<p>Eu podia simplesmente ser eu.</p>

<p>E ela nunca tentou mudar isso.</p>

<p class="destaque">
Talvez eu estivesse começando a perceber
o valor de alguém que sempre esteve ao meu lado.
</p>
`
},

{

numero: "CAPÍTULO 6",

titulo: "A índia",

texto: `
<p>Durante um culto em Braúna, em uma aldeia, apareceu uma jovem indígena.</p>

<p>Ela tinha cabelos longos, era moreninha e tinha olhos marcantes.</p>

<p>Ela ficava de olho em mim.</p>

<p>E a Mirela percebeu.</p>

<p>Foi naquele momento que talvez tenha surgido um sentimento diferente.</p>

<p class="destaque">
E se eu perder ele?
</p>

<p>Ela percebeu o quanto gostava de mim.</p>
`
},

{

numero: "CAPÍTULO 7",

titulo: "Quatro meses",

texto: `
<p>Depois disso, nós conversamos sobre tudo.</p>

<p>Eu já sabia o que sentia.</p>

<p>Então falei para ela que gostava dela.</p>

<p>E aí começou a espera.</p>

<p>Um mês.</p>

<p>Dois meses.</p>

<p>Três meses.</p>

<p><strong>Quatro meses. 😂</strong></p>

<p class="destaque">
A Mirela me enrolou por quatro meses.
</p>
`
},

{

numero: "CAPÍTULO 8",

titulo: "O pedido",

texto: `
<p>Eu construí um buquê junto com o ferreiro.</p>

<p>Depois fui até Birigui.</p>

<p>Fui até a porta da escola dela.</p>

<p>E apareci de surpresa.</p>

<p>Na frente das pessoas que estavam ali, com o buquê nas mãos, fiz a pergunta.</p>

<p class="destaque">
“Mirela, quer namorar comigo?” ❤️
</p>
`
},

{

numero: "21 • 10 • 2025",

titulo: "Finalmente, nós dois",

texto: `
<p>Depois de nove anos de amizade...</p>

<p>Depois de tantas conversas.</p>

<p>Tantas histórias.</p>

<p>Tantos momentos.</p>

<p>Finalmente chegou o nosso dia.</p>

<p class="destaque">
21 de outubro de 2025.
</p>

<p>O dia em que nossa amizade ganhou um novo capítulo.</p>

<p><strong>O dia em que nós começamos a namorar. ❤️</strong></p>
`
}

];


function começar() {

document.getElementById("abertura").classList.add("escondido");

document.getElementById("historia").classList.remove("escondido");

mostrar();

}


function mostrar() {

document.getElementById("numero").innerHTML =
historia[capitulo].numero;

document.getElementById("titulo").innerHTML =
historia[capitulo].titulo;

document.getElementById("texto").innerHTML =
historia[capitulo].texto;

}


function proximo() {

if (capitulo < historia.length - 1) {

capitulo++;

mostrar();

window.scrollTo(0,0);

} else {

alert("Nossa história ainda está apenas começando. ❤️");

}

}

</script>

</body>

</html>
