<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para minha Baixinha ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #180b20, #5b214b);
            color: white;
            font-family: Georgia, serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .tela {
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        .coracao {
            font-size: 80px;
            animation: pulsar 1.5s infinite;
        }

        h1 {
            font-size: 48px;
            margin: 10px 0;
        }

        .subtitulo {
            font-size: 20px;
            opacity: 0.85;
            line-height: 1.6;
        }

        .data {
            margin-top: 25px;
            font-size: 18px;
            letter-spacing: 5px;
        }

        button {
            margin-top: 35px;

            padding: 16px 30px;

            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 50px;

            background: rgba(255,255,255,0.12);
            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.05);
        }

        @keyframes pulsar {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }

        }
    </style>
</head>

<body>

    <div class="tela">

        <div class="coracao">
            ❤️
        </div>

        <h1>
            Para minha Baixinha
        </h1>

        <div class="subtitulo">
            Uma história que começou muito antes do nosso namoro...
        </div>

        <div class="data">
            21 • 10 • 2025
        </div>

        <button onclick="comecarHistoria()">
            ✨ Começar nossa história
        </button>

    </div>

    <script>

        function comecarHistoria() {

            alert(
                "Nossa história está apenas começando... ❤️"
            );

        }

    </script>

</body>
</html>
